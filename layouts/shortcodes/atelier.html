{{- /* Carte d'atelier : n, titre, intention, mot, saison (optionnel). */ -}}
<article style="background: #FFFFFF; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #A04B22; letter-spacing: 0.06em; text-transform: uppercase">N° {{ .Get "n" }}{{ with .Get "saison" }} · {{ . }}{{ end }}</span>
<strong style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 23px; font-weight: 600; line-height: 1.2; color: #2B3B22">{{ .Get "titre" }}</strong>
<span style="color: #46503B; font-size: 16px">{{ .Get "intention" }}</span>
<span style="align-self: flex-start; margin-top: 4px; background: #E6ECD9; color: #3E5530; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700">{{ .Get "mot" }}</span>
</article>
